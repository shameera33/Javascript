<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Access</title>
</head>
<body>
    <p id="demo"></p>
    <button onclick="ageCheck()">Check Access</button>

    <script>

        let user={
            name: "Emma",
            age: 30,
            admin: true,
        };
        
        let access=(user.age>=18 && user.admin) ? "Access Granted" : "Access Denied";

        function ageCheck() {
            document.getElementById("demo").innerHTML=access;
        }

        let ageExist="age" in user;
        delete user.age;

    </script>
</body>
</html>
