<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment system</title>
</head>
<body>
    <script>
    
    let comment = "My son is 12 years old. Our flat number is 45 and contact is 9876543210.";
    
    let digitCheck = /\d/.test(comment);
    
    let updatedComment = comment.replace(/\d+/g, "NUMBER");
    
    console.log("User comment: " + comment);
    console.log("Number present: " + digitCheck);
    console.log("Updated comment: " + updatedComment);
    
    </script>
</body>
</html>
