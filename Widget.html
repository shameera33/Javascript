<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget</title>
</head>
<body>
    <script>
    let number=Math.floor(Math.random() * 100) + 1;
    let userScore="75";
    let score=Number(userScore);
    let difference=Math.abs(number - userScore);
    let roundedScore=Math.round(Math.sqrt(userScore));
    let pi=Math.PI;
    let toNumber='50' *  2;

    console.log("number: " + number);
    console.log("userScore: " + userScore);
    console.log("Score: " + score);
    console.log("Difference: " + difference);
    console.log("Rounded score: " + roundedScore);
    console.log("Pi value: " + pi);
    console.log("String to numbr: " + toNumber);
    </script>
</body>
</html>
